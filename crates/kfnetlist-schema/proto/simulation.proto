syntax = "proto3";

package circuit;

import "value.proto";

// ======================================================================
// Enums
// ======================================================================

enum AnalysisKind {
    ANALYSIS_KIND_UNSPECIFIED = 0;
    ANALYSIS_KIND_OP          = 1;
    ANALYSIS_KIND_DC          = 2;
    ANALYSIS_KIND_AC          = 3;
    ANALYSIS_KIND_TRAN        = 4;
    ANALYSIS_KIND_NOISE       = 5;
    ANALYSIS_KIND_TF          = 6;
    ANALYSIS_KIND_SENS        = 7;
    ANALYSIS_KIND_PZ          = 8;
    ANALYSIS_KIND_DISTO       = 9;
    ANALYSIS_KIND_FOUR        = 10;
    ANALYSIS_KIND_FFT         = 11;
}

enum OutputRequestKind {
    OUTPUT_REQUEST_KIND_UNSPECIFIED = 0;
    OUTPUT_REQUEST_KIND_PRINT      = 1;
    OUTPUT_REQUEST_KIND_PLOT       = 2;
    OUTPUT_REQUEST_KIND_PROBE      = 3;
    OUTPUT_REQUEST_KIND_SAVE       = 4;
}

// Transient shape of a source: SPICE PULSE/SIN/EXP/SFFM/PWL, Spectre `type=`.
enum WaveformKind {
    WAVEFORM_KIND_UNSPECIFIED = 0;
    WAVEFORM_KIND_PULSE       = 1;
    WAVEFORM_KIND_SIN         = 2;
    WAVEFORM_KIND_EXP         = 3;
    WAVEFORM_KIND_SFFM        = 4;
    WAVEFORM_KIND_PWL         = 5;
}

// ======================================================================
// Simulation messages
// ======================================================================

message Analysis {
    AnalysisKind          kind      = 1;
    string                name      = 2;
    repeated string       arguments = 10;
    map<string, string>   options   = 20;
}

message OutputRequest {
    OutputRequestKind   kind          = 1;
    string              analysis_type = 2;
    repeated string     variables     = 10;
}

message Measurement {
    string name          = 1;
    string analysis_type = 2;
    string body          = 3;
}

message InitialCondition {
    map<string, string> conditions = 1;
}

// A transient waveform. `args` uses SPICE semantics with Spectre names:
// pulse val0 val1 delay rise fall width period; sin sinedc ampl freq delay theta;
// exp val0 val1 delay tau1 td2 tau2 (td2 from time 0); sffm sinedc ampl freq
// modindex modfreq. PWL keeps its time/value pairs in `points` (t0 v0 t1 v1 ...)
// or reads them from `file`, a POSIX path (see kfnetlist_schema::paths).
message Waveform {
    WaveformKind                kind   = 1;
    map<string, ParameterValue> args   = 2;
    repeated ParameterValue     points = 3;
    string                      file   = 4;
}

// What drives one V/I source; the source element names it in
// properties["stimulus"] ("<circuit>/<instance>").
message Stimulus {
    string         name         = 1;
    ParameterValue dc           = 2;
    ParameterValue ac_magnitude = 3;
    ParameterValue ac_phase     = 4;
    Waveform       waveform     = 5;
}

message Simulation {
    repeated Analysis         analyses           = 1;
    repeated OutputRequest    output_requests    = 2;
    repeated Measurement      measurements       = 3;
    InitialCondition          initial_conditions = 4;
    InitialCondition          node_sets          = 5;
    repeated double           temperatures       = 6;
    repeated Stimulus         stimuli            = 7;
    map<string, string>       options            = 10;
}

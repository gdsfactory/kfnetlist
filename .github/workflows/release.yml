name: release

on:
  push:
    tags: "v*"

permissions:
  contents: read

jobs:
  # Build wheels for each platform using maturin
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x86_64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto

      # macOS 27's dyld rejects a misaligned LINKEDIT string pool (#31)
      - name: Check Mach-O string pool alignment
        if: runner.os == 'macOS'
        run: |
          unzip -o -q dist/*.whl -d wheel
          stroff=$(otool -l wheel/kfnetlist/_native.abi3.so | awk '/cmd LC_SYMTAB/{f=1} f&&/stroff/{print $2; exit}')
          test $((stroff % 8)) -eq 0 || { echo "::error::stroff $stroff is not 8-byte aligned"; exit 1; }

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  # Build the source distribution
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Publish all artifacts to PyPI
  publish:
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "kfnetlist"
description = "Netlist schema for kfactory with bidirectional netlist format conversion (SPICE, HSPICE, Xyce, Spectre, Verilog-AMS)"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
version = "0.4.0"
authors = [{ name = "gdsfactory community", email = "contact@gdsfactory.com" }]
dependencies = [
    "lark>=1.3.1",
    "protobuf>=7.36.0",
    "pydantic>=2.13.5",
    "pydantic-yaml>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "klayout>=0.30.8,<0.31",
    "pytest>=9.0.3,<10",
    "ruff>=0.15.12,<0.16",
]
notebooks = [
    "jupytext>=1.16.2,<2",
    "nbconvert>=7.16,<8",
    "ipykernel>=6.29,<7",
]
docs = [
    "kfnetlist[notebooks]",
    "zensical>=0.0.40,<0.1",
    "mkdocs-literate-nav>=0.6.3,<0.7",
    "mkdocstrings[python]>=1.0.4,<1.1",
    "pymdown-extensions>=10.21.2,<10.22",
    "ruff>=0.15.12,<0.16",
]

[tool.maturin]
manifest-path = "crates/kfnetlist-python/Cargo.toml"
python-source = "src"
module-name = "kfnetlist._native"
features = ["pyo3/extension-module"]
include = [{ path = ".cargo/config.toml", format = "sdist" }]

[tool.codespell]
ignore-words-list = "ure, THE, BE, WE, TO, the, be, we, to, astroid, input, output, inout, in, out, TE"

[tool.ruff]
exclude = ["docs", "*_pb2.py", "*_pb2.pyi"]

[tool.ruff.lint.per-file-ignores]
# Vendored from morphnet; kept close to upstream.
"tests/morphnet/**" = ["E741"]

[tool.ty.src]
exclude = [
    "docs",
    "**/*_pb2.py",
    "**/*_pb2.pyi",
]

# Vendored from morphnet: protobuf-descriptor and Optional-access patterns that
# morphnet's own tests exercise; kept as upstream wrote them.
[[tool.ty.overrides]]
include = ["src/kfnetlist/morphnet/**", "tests/morphnet/**"]

[tool.ty.overrides.rules]
incompatible-attribute-override = "ignore"
missing-attribute = "ignore"
missing-union-attribute = "ignore"
unused-ignore-comment = "ignore"
pydantic-discarded-extra-argument = "ignore"

# Tests exercise the deprecated pre-morphnet schema API on purpose.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
deprecated = "ignore"

[tool.tbump]

[tool.tbump.version]
current = "0.4.0"
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (?:(?P<pre>(a|b|rc)\d+))?
  (?:\.post(?P<post>\d+))?
  (?:\.dev(?P<dev>\d+))?
'''

[tool.tbump.git]
message_template = "Bump to {new_version}"
tag_template = "v{new_version}"

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'version = "{current_version}"'

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'current = "{current_version}"'

[[tool.tbump.file]]
src = "Cargo.toml"

[[tool.tbump.file]]
src = "src/kfnetlist/__init__.py"

[dependency-groups]
dev = [
    "klayout>=0.30.12",
    "pre-commit>=4.6.0",
    "pylint>=4.0.8",
    "pytest>=9.1.1",
    "ruff>=0.15.16",
]

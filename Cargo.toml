[package]
name = "kfnetlist"
version = "0.2.2"
edition = "2021"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py312"] }
pythonize = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
prost-types = "0.14.4"
prost-build = "0.13"

[build-dependencies]
prost-build = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1

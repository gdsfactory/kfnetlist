[workspace]
members = ["crates/kfnetlist-core", "crates/kfnetlist-python"]
default-members = ["crates/kfnetlist-core"]
resolver = "2"

[workspace.package]
version = "0.2.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/gdsfactory/kfnetlist"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1

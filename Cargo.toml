[workspace]
members = [
    "crates/kfnetlist-core",
    "crates/kfnetlist-schema",
    "crates/kfnetlist-python",
]
default-members = ["crates/kfnetlist-core"]
resolver = "2"

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/gdsfactory/kfnetlist"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse floats exactly (the bridge and .gsch stashes round-trip JSON)
serde_json = { version = "1", features = ["float_roundtrip"] }
indexmap = { version = "2", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
